[package]
name = "lino"
version = "0.2.4"
description = "Lino desktop AI assistant"
authors = ["FazaSolutions"]
edition = "2021"

[lib]
name = "lino_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
